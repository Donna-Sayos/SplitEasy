<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitEasy — Sign In or Quick Split</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">
  <header class="navbar">
    <div class="brand">SplitEasy</div>
    <div class="nav-right">
      <span class="nav-tagline">Group Bill &amp; Meal Splitter</span>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 id="auth-title">Welcome back</h1>
        <p id="auth-subtitle" class="subtext">Sign in to access your saved bills and automatic state tax.</p>
      </div>

      <!-- Segmented Tab Switcher -->
      <div class="segmented-tabs" role="tablist">
        <button type="button" id="tab-login" class="seg-btn active" onclick="switchTab('login')">Log In</button>
        <button type="button" id="tab-register" class="seg-btn" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Alert Message -->
      <div id="auth-alert" class="alert" role="alert"></div>

      <!-- Log In Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-identifier">Username or Email</label>
          <input type="text" id="login-identifier" placeholder="alex_m or alex@uni.edu" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary">Log In &amp; View Dashboard</button>
      </form>

      <!-- Create Account Form -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="alex_m" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="alex@uni.edu" autocomplete="email" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Create password" autocomplete="new-password" required />
          </div>
          <div class="form-group">
            <label for="reg-state">Home State (Auto Tax)</label>
            <select id="reg-state" required>
              <option value="">Loading states...</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Create Account &amp; Start</button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span>or split immediately without an account</span>
      </div>

      <!-- Guest Mode Footer Box -->
      <div class="guest-strip">
        <div class="guest-strip-info">
          <strong>Continue as Guest</strong>
          <span>Split equally or per meal with custom state tax &amp; tip. History is not saved.</span>
        </div>
        <a href="{{ url_for('guest_mode') }}" class="btn btn-secondary guest-btn">Quick Split &rarr;</a>
      </div>
    </div>
  </main>

  <script>
    function showAlert(message, type) {
      const box = document.getElementById("auth-alert");
      box.textContent = message;
      box.className = "alert " + type;
    }

    function clearAlert() {
      const box = document.getElementById("auth-alert");
      box.textContent = "";
      box.className = "alert";
    }

    function switchTab(tab) {
      clearAlert();
      const isLogin = tab === "login";

      document.getElementById("tab-login").classList.toggle("active", isLogin);
      document.getElementById("tab-register").classList.toggle("active", !isLogin);

      document.getElementById("login-form").classList.toggle("hidden", !isLogin);
      document.getElementById("register-form").classList.toggle("hidden", isLogin);

      document.getElementById("auth-title").textContent = isLogin ? "Welcome back" : "Create your account";
      document.getElementById("auth-subtitle").textContent = isLogin
        ? "Sign in to access your saved bills and automatic state tax."
        : "Save timestamped receipts and auto-apply your home state sales tax.";
    }

    async function loadStates() {
      const select = document.getElementById("reg-state");
      try {
        const res = await fetch("/api/states");
        const states = await res.json();
        select.innerHTML = '<option value="">Select state...</option>';
        states.forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s.state_code;
          opt.textContent = `${s.state_code} - ${s.state_name} (${(s.tax_rate * 100).toFixed(2)}%)`;
          select.appendChild(opt);
        });
      } catch (err) {
        select.innerHTML = '<option value="">Could not load states</option>';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearAlert();
      const identifier = document.getElementById("login-identifier").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = data.redirect;
        } else {
          showAlert(data.error || "Login failed.", "error");
        }
      } catch (err) {
        showAlert("Network error. Please try again.", "error");
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearAlert();
      const username = document.getElementById("reg-username").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;
      const state_code = document.getElementById("reg-state").value;

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password, state_code })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = data.redirect;
        } else {
          showAlert(data.error || "Could not create account.", "error");
        }
      } catch (err) {
        showAlert("Network error. Please try again.", "error");
      }
    }

    document.addEventListener("DOMContentLoaded", loadStates);
  </script>
</body>
</html>
